name: portal-graduados

services:
  postgres:
    image: postgres:17
    container_name: postgres17-portal-graduados
    restart: always
    environment:
      POSTGRES_USER: portal_admin
      POSTGRES_PASSWORD: "Portal2026"
      POSTGRES_DB: portal_graduados_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5434:5432"

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin-portal-graduados
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: portal.admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: "Portal2026"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
  pgadmin_data: